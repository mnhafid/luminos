# The root repo pins 1.88.0 for the Tauri app; gpui's dependency tree needs
# newer (the pinned zed-cap rev uses std::hint::cold_path, stable since 1.94;
# zed-cap itself pins 1.95.0 and a stale local "stable" broke the build). The
# nearest toolchain file wins, so this only affects apps/desktop-gpui.
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
